# Radio stations backing `/music radio play`.
#
# Users pick a genre or a mood, never a station: `genre` must be one of the values in
# `Genre::ALL` (zayden-app/src/config/radio.rs), and every station tagged with it forms
# that choice's pool. One is picked at random per session, and the rest are the failover
# set when a stream dies, so aim for at least two per genre. A station with an
# unrecognised `genre`, a non-http `stream_url` or a duplicate `id` is dropped at boot
# with a warning; genres left with no station are warned about too.

