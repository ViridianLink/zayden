# Game server hosting (`/server host`). Disabled unless [[hosting.games]] and
# kofi_url are both present and PELICAN_BASE_URL/PELICAN_API_KEY are set — the
# Application API key is the same `pacc_` key the [pelican] save refresh uses.
[hosting]
# Link users follow to pay. It must front four membership tiers priced at 2.50,
# 5.00, 7.50 and 10.00; the tier name is matched on the amount embedded in it,
# so the surrounding words and currency symbol are free-form.
kofi_url = "https://ko-fi.com/your-page"
# Panel URL DM'd with credentials. Defaults to PELICAN_BASE_URL.
panel_url = "https://panel.example.com"
# Passed to the Application API `deploy` block so the panel picks node and
# allocation itself. Empty means "any location".
location_ids = [1]
# Trial length in HOURS. It exists to prove the server comes up, that people can
# connect and that the specs are what was advertised — not as a free tier. 1-6 is
# the sane range; anything longer is long enough to be farmed.
trial_hours = 4
# Days a lapsed *subscription* stays suspended before deletion. Never applied to
# a trial: a trial that was not paid for is deleted as soon as it ends.
grace_days = 3
# Days before a subscription lapses that the reminder DM fires. Trials never get
# a reminder — they are shorter than any sane value here.
reminder_days = 2
# Global ceilings, guarding the box rather than the buyer. max_servers is bounded
# by the node's free allocations; max_ram_mib by real host RAM, not the LXC cap.
max_servers = 13
max_ram_mib = 16384

# One entry per offered game. `egg_id` is the panel's own egg id — read them from
# `GET /api/application/eggs`. Everything else (docker image, startup command,
# default variables) is fetched from the egg at provision time; the optional
# `env` table only overrides individual variables.
[[hosting.games]]
key = "minecraft-paper"
name = "Minecraft (Paper)"
egg_id = 3

[[hosting.games]]
key = "palworld"
name = "Palworld"
egg_id = 15

[hosting.games.env]
COMMUNITY = "false"

# Discord monetisation SKU ids, from the Developer Portal.
[entitlements.discord.skus]
pro = 1234567890
ultra = 9876543210
