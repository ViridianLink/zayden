[package]
name = "dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dashboard"
path = "src/main.rs"
required-features = ["ssr"]

# Exactly one of ssr / hydrate should be active during any given compilation.
# cargo-leptos handles this automatically.  For manual cargo check:
#   cargo check -p dashboard --features ssr
#   cargo check -p dashboard --target wasm32-unknown-unknown --features hydrate
[features]
default = []

hydrate = [
  "leptos/hydrate",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
]

ssr = [
  "leptos/ssr",
  "dep:leptos_axum",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "dep:axum",
  "dep:dotenvy",
  "dep:greetings",
  "dep:honeypot",
  "dep:jiff",
  "dep:jiff-sqlx",
  "dep:moka",
  "dep:oauth2",
  "dep:palworld",
  "dep:patreon",
  "dep:rand",
  "dep:reaction-roles",
  "dep:rustls",
  "dep:sha2",
  "dep:sqlx",
  "dep:suggestions",
  "dep:tokio",
  "dep:zip",
  "dep:ticket",
  "dep:tower-cookies",
  "dep:tracing-subscriber",
  "dep:twilight-http",
  "dep:url",
  "dep:zayden-app",
]

[dependencies]
leptos = { workspace = true }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }

leptos_axum = { workspace = true, optional = true }

axum = { workspace = true, optional = true }
dotenvy = { workspace = true, optional = true }
greetings = { workspace = true, optional = true }
honeypot = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
jiff-sqlx = { workspace = true, optional = true }
moka = { workspace = true, features = ["future"], optional = true }
oauth2 = { workspace = true, optional = true }
palworld = { workspace = true, optional = true }
patreon = { workspace = true, optional = true }
rand = { workspace = true, features = ["thread_rng"], optional = true }
reaction-roles = { workspace = true, optional = true }
rustls = { workspace = true, features = ["aws-lc-rs"], optional = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, features = [
  "postgres",
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
  "macros",
], optional = true }
suggestions = { workspace = true, optional = true }
ticket = { workspace = true, optional = true }
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "sync",
], optional = true }
zip = { workspace = true, features = ["deflate"], optional = true }
tower-cookies = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = [
  "ansi",
  "fmt",
], optional = true }
twilight-http = { workspace = true, optional = true }
twilight-model = { workspace = true }
url = { workspace = true, optional = true }
zayden-app = { workspace = true, optional = true }

# -- Hydrate-only

wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = [
  "Blob",
  "Document",
  "Headers",
  "HtmlAnchorElement",
  "HtmlCollection",
  "HtmlOptionElement",
  "HtmlSelectElement",
  "Request",
  "RequestInit",
  "Response",
  "Url",
  "Window",
] }

# ── cargo-leptos build configuration ─────────────────────────────────────────

[package.metadata.leptos]
output-name = "dashboard"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
tailwind-input-file = "style/input.css"
site-addr = "0.0.0.0:3000"
reload-port = 3001
env = "DEV"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
