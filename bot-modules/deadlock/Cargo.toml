[package]
name = "deadlock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zayden-core = { workspace = true }

deadlock-api = { workspace = true }
futures = { workspace = true, features = ["std", "async-await"] }
jiff = { workspace = true, features = ["std"] }
jiff-cron = { workspace = true }
jiff-sqlx = { workspace = true, features = ["postgres"] }
moka = { workspace = true, features = ["future"] }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
serenity = { workspace = true, features = ["rustls_backend", "builder", "gateway"] }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true, features = ["migrate"] }
tokio = { workspace = true, features = ["macros", "rt", "net", "io-util"] }
