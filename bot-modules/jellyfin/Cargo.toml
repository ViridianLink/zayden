[package]
name = "jellyfin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zayden-app = { workspace = true }
zayden-core = { workspace = true }
zayden-graphics = { workspace = true }

futures = { workspace = true, features = ["std", "async-await"] }
jiff = { workspace = true }
jiff-cron = { workspace = true }
jiff-sqlx = { workspace = true }
moka = { workspace = true, features = ["future"] }
reqwest = { workspace = true, features = ["rustls", "http2", "json", "query"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serenity = { workspace = true }
sqlx = { workspace = true, features = ["migrate"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
