[package]
name = "youtube"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
zayden-core = { workspace = true }

futures = { workspace = true }
hmac = { workspace = true }
jiff = { workspace = true, features = ["std"] }
jiff-cron = { workspace = true }
jiff-sqlx = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "http2", "json", "query", "form"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
serenity = { workspace = true, features = ["rustls_backend", "builder", "gateway"] }
sha1 = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
sqlx = { workspace = true, features = ["migrate"] }
tokio = { workspace = true, features = ["macros", "rt"] }
