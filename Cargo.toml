[workspace]
resolver = "3"
members = ["bot", "bot-modules/*", "dashboard", "zayden-app"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Oscar Six"]
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

unused = { level = "warn", priority = -1 }
unused_imports = "deny"
unused_must_use = "deny"

unreachable_pub = "warn"
unused_qualifications = "warn"

# missing_debug_implementations = "warn"

rust_2018_idioms = { level = "deny", priority = -1 }

# Catch accidental lifetime elision weirdness
elided_lifetimes_in_paths = "deny"

# Common correctness footguns
noop_method_call = "deny"
redundant_lifetimes = "deny"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
variant_size_differences = "warn"

# Future compatibility
future_incompatible = { level = "deny", priority = -1 }

[workspace.lints.clippy]

# Correctness / panic prevention

unwrap_used = "deny"
expect_used = "deny"

panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"

todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

indexing_slicing = "warn"
string_slice = "warn"

unchecked_time_subtraction = "warn"

# Async correctness

await_holding_lock = "deny"
await_holding_refcell_ref = "deny"

unused_async = "warn"

# Performance

large_futures = "warn"
large_stack_arrays = "warn"

redundant_clone = "warn"
inefficient_to_string = "warn"

rc_buffer = "warn"
clone_on_ref_ptr = "warn"

# API quality

semicolon_if_nothing_returned = "warn"

must_use_candidate = "warn"
return_self_not_must_use = "warn"
too_long_first_doc_paragraph = "warn"
derive_partial_eq_without_eq = "warn"
implicit_hasher = "warn"

missing_const_for_fn = "warn"

# Error handling

result_large_err = "warn"
map_err_ignore = "warn"
unwrap_in_result = "warn"
error_impl_error = "warn"

# Style / maintainability

wildcard_imports = "warn"
wildcard_enum_match_arm = "warn"

manual_assert = "warn"
manual_ok_or = "warn"

match_same_arms = "warn"

assert_is_empty = "warn"

# Keeping attributes honest (excellent for AI agents)
allow_attributes_without_reason = "warn"
allow_attributes = "warn"

# Memory and Synchronization
mem_forget = "deny"
mutex_atomic = "warn"
rc_mutex = "warn"

# Pedantic + nursery

pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Noise reductions

module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

struct_excessive_bools = "allow"
too_many_lines = "allow"

similar_names = "allow"

# Often counterproductive in real systems
implicit_return = "allow"
single_call_fn = "allow"
single_match_else = "allow"

# Conflicts with `unreachable_pub`
redundant_pub_crate = "allow"

[workspace.dependencies]

# -- Workspace members
ai = { path = "./bot-modules/ai" }
destiny2 = { path = "./bot-modules/destiny2" }
family = { path = "./bot-modules/family" }
gambling = { path = "./bot-modules/gambling" }
gold-star = { path = "./bot-modules/gold-star" }
greetings = { path = "./bot-modules/greetings" }
honeypot = { path = "./bot-modules/honeypot" }
levels = { path = "./bot-modules/levels" }
lfg = { path = "./bot-modules/lfg" }
llamad2 = { path = "./bot-modules/llamad2" }
marathon = { path = "./bot-modules/marathon" }
music = { path = "./bot-modules/music" }
palworld = { path = "./bot-modules/palworld" }
reaction-roles = { path = "./bot-modules/reaction-roles" }
servers-at-home = { path = "./bot-modules/servers-at-home" }
suggestions = { path = "./bot-modules/suggestions" }
temp-voice = { path = "./bot-modules/temp-voice" }
ticket = { path = "./bot-modules/ticket" }
verify = { path = "./bot-modules/verify" }
zayden-core = { path = "./bot-modules/zayden-core" }
zayden-graphics = { path = "./bot-modules/zayden-graphics" }
zayden-app = { path = "./zayden-app" }

# -- First-party git dependencies
bungie-api = { git = "https://github.com/ViridianLink/bungie-api.git", branch = "main" }
google-sheets-api = { git = "https://github.com/ViridianLink/google-sheets-api.git", branch = "main" }

# -- Discord
serenity = { git = "https://github.com/serenity-rs/serenity", branch = "next", default-features = false, features = [
  "rustls_backend",
  "transport_compression_zlib",
  "transport_compression_zstd",
] }
songbird = { git = "https://github.com/KiloOscarSix/songbird", branch = "serenity-next", default-features = false }
twilight-http = { version = "*", default-features = false, features = [
  "decompression",
  "rustls-webpki-roots",
] }
twilight-model = { version = "*" }

# -- Errors
thiserror = { version = "*", default-features = false }

# -- Collections and concurrency
ahash = { version = "*", default-features = false, features = ["std"] }
arrayvec = { version = "*", default-features = false }
compact_str = { version = "*", default-features = false, features = ["std"] }
dashmap = { version = "*", default-features = false }
itertools = { version = "*", default-features = false, features = ["use_std"] }
moka = { version = "*", default-features = false }
rayon = { version = "*", default-features = false }
smallvec = { version = "*", default-features = false }

# -- Randomness and numerics
bigdecimal = { version = "*", default-features = false }
rand = { version = "*", default-features = false }
rand_distr = { version = "*", default-features = false }

# -- Serialization
base64 = { version = "*", default-features = false }
serde = { version = "*", default-features = false }
serde_json = { version = "*", default-features = false }
toml = { version = "*", default-features = false }

# -- GraphQL
cynic = { version = "*", default-features = false }
cynic-codegen = { version = "*", default-features = false }

# -- Dates and times
jiff = { version = "*", default-features = false }
jiff-cron = { version = "*", default-features = false }
jiff-sqlx = { version = "*", default-features = false }

# -- CLI and configuration
clap = { version = "*", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
  "derive",
  "env",
] }
dotenvy = { version = "*", default-features = false }

# -- HTTP client
reqwest = { version = "*", default-features = false, features = ["rustls"] }
oauth2 = { version = "*", default-features = false, features = [
  "reqwest",
  "rustls-tls",
] }
rustls = { version = "*", default-features = false }
scraper = { version = "*", default-features = false }
url = { version = "*", default-features = false }

# -- HTTP server
axum = { version = "*", default-features = false, features = [
  "http1",
  "http2",
  "macros",
  "form",
  "json",
  "matched-path",
  "original-uri",
  "query",
  "tokio",
  "tower-log",
  "tracing",
] }
tower = { version = "*", default-features = false, features = ["util"] }
tower-cookies = { version = "*", default-features = false, features = [
  "axum-core",
] }
utoipa = { version = "*", default-features = false, features = [
  "macros",
  "jiff_0_2",
  "uuid",
] }

# -- Database
sqlx = { version = "*", default-features = false, features = [
  "macros",
  "postgres",
  "tls-rustls-aws-lc-rs",
  "runtime-tokio",
] }
uuid = { version = "*", default-features = false, features = [
  "std",
  "v4",
  "serde",
] }

# -- Async runtime
async-trait = { version = "*", default-features = false }
futures = { version = "*", default-features = false }
tokio = { version = "*", default-features = false }
tokio-util = { version = "*", default-features = false }

# -- Observability
tracing = { version = "*", default-features = false }
tracing-subscriber = { version = "*", default-features = false }

# -- AI
async-openai = { version = "*", default-features = false }

# -- Media
png = { version = "*", default-features = false }
resvg = { version = "*", default-features = false, features = [
  "text",
  "memmap-fonts",
] }
rspotify = { version = "*", default-features = false }
symphonia = { version = "0.5", default-features = false }

# -- Game-save and archive formats
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
gvas = { version = "0.11" }
oozextract = { version = "=0.5.0" }
zip = { version = "*", default-features = false }

# -- Text and hashing
regex = { version = "*", default-features = false }
sha2 = { version = "*", default-features = false }

# -- Frontend (Leptos)
leptos = { version = "*", default-features = false }
leptos_meta = { version = "*", default-features = false }
leptos_router = { version = "*", default-features = false }
leptos_axum = { version = "*" }

# ── WASM (hydrate target only) ───────────────────────────────────────────────
wasm-bindgen = { version = "*" }
wasm-bindgen-futures = { version = "*" }
web-sys = { version = "*" }

# ── Testing and benchmarking ─────────────────────────────────────────────────
criterion = { version = "*", default-features = false, features = [
  "cargo_bench_support",
] }
insta = { version = "*", default-features = false }
mockall = { version = "*", default-features = false }
proptest = { version = "*", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 0
debug = false
debug-assertions = true
overflow-checks = true
incremental = true
codegen-units = 256
lto = false

[profile.dev.build-override]
opt-level = 3
debug = false

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
